AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Visit counter and feedback API for the CloudOps site
Parameters:
  SiteOrigin: { Type: String, Default: 'https://sumitkuddor.github.io' }
Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
  Fn:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: app.handler
      CodeUri: lambda/
      Timeout: 5
      ReservedConcurrentExecutions: 5
      Environment: { Variables: { TABLE: !Ref Table } }
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref Table } }]
      FunctionUrlConfig:
        AuthType: NONE
        Cors: { AllowOrigins: [!Ref SiteOrigin], AllowMethods: [GET, POST], AllowHeaders: [content-type] }
Outputs:
  ApiUrl: { Value: !GetAtt FnUrl.FunctionUrl }
